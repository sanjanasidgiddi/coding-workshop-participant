[pytest]
testpaths = tests
markers =
    unit: pure/mocked-dependency tests, no real DB or network (Lambda handlers in isolation)
    integration: real HTTP calls through the local LocalStack proxy + real Postgres
    error_handling: validation/error-status/RBAC-denial assertions (may live inside unit or integration tests)

[coverage:run]
source =
    facilities
    incidents
    notes
    users
omit =
    */dependencies/*
    */__pycache__/*
    tests/*

[coverage:report]
skip_empty = true
